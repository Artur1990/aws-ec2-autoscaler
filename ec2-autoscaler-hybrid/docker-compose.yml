version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: hybrid-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: hybrid-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      TZ: ${TZ:-UTC}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-false}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_RESTRICT_FILE_ACCESS_TO: /home/node/.n8n-files,/opt/ec2-autoscaler
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      NODE_FUNCTION_ALLOW_BUILTIN: fs
    volumes:
      - n8n_data:/home/node/.n8n
      - ./config:/opt/ec2-autoscaler/config:ro
      - ./config:/home/node/.n8n-files/config:ro
      - ./logs:/opt/ec2-autoscaler/logs
      - ./workflows:/opt/ec2-autoscaler/workflows:ro

  autoscaler:
    build:
      context: ./autoscaler
      dockerfile: Dockerfile
    container_name: hybrid-autoscaler
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION}
      AUTOSCALER_CONFIG: /opt/ec2-autoscaler/config/config.json
      AUTOSCALER_STATE: /opt/ec2-autoscaler/logs/state.json
      AUTOSCALER_DECISIONS_LOG: /opt/ec2-autoscaler/logs/decisions.jsonl
      AUTOSCALER_AUDIT_LOG: /opt/ec2-autoscaler/logs/audit.jsonl
      AUTOSCALER_INTERVAL_SECONDS: ${AUTOSCALER_INTERVAL_SECONDS:-300}
    volumes:
      - ./config:/opt/ec2-autoscaler/config:ro
      - ./logs:/opt/ec2-autoscaler/logs
    command: ["python", "src/autoscaler.py", "run-loop"]

volumes:
  pg_data:
  n8n_data:
